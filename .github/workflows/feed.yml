name: Aggiorna feed usato

on:
  schedule:
    - cron: "30 3 * * *"   # ogni notte alle 03:30 UTC (04:30 o 05:30 in Italia)
  workflow_dispatch: {}     # si può lanciare anche a mano dalla scheda Actions

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Genera il file dalle pagine pubbliche del sito
        run: python -X utf8 genera-feed-usato.py feed-usato-meta.csv
      - name: Segna l'ultimo aggiornamento (tiene il deposito "attivo")
        run: date -u +"%Y-%m-%d %H:%M UTC" > ultimo-aggiornamento.txt
      - name: Salva se è cambiato qualcosa
        run: |
          git config user.name "feed-usato-bot"
          git config user.email "feed-usato-bot@users.noreply.github.com"
          git add feed-usato-meta.csv ultimo-aggiornamento.txt
          git commit -m "Feed del $(date -u +%F)" || exit 0
          git push
